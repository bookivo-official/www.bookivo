<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bookivo – Sign up / Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="animated-gradient-bg">
  <main class="page">

    <!-- LEFT: white 4:5 block holding image.png -->
    <section class="hero" aria-hidden="true">
      <img src="image.png" alt="">
    </section>

    <!-- RIGHT: sign up / login card -->
    <section class="card" id="card">
      <canvas id="bg" aria-hidden="true"></canvas>

      <!-- SIGN UP -->
      <div class="signup">
        <button class="signup-title" id="toSignup" type="button">Sign up</button>
        <form class="signup-form" id="signupForm" novalidate>
          <input type="text" name="username" placeholder="User name" aria-label="User name" autocomplete="username" required>
          <div class="field">
            <input type="email" name="email" placeholder="Email" aria-label="Email" autocomplete="email" required>
            <button class="verify" type="button" aria-label="Send OTP to this email">Verify</button>
          </div>
          <input type="text" name="otp" placeholder="Enter OTP" aria-label="Enter OTP" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]*" required>
          <button class="btn" type="submit">Sign up</button>
          <div class="or">or</div>
          <button class="google" type="button" data-google>
            <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
            Continue with Google
          </button>
          <p class="msg" id="msgSignup" role="status" aria-live="polite"></p>
        </form>
      </div>

      <!-- LOGIN -->
      <div class="login" id="login">
        <button class="login-title" id="toLogin" type="button" aria-expanded="false" aria-controls="loginForm">Login</button>
        <form class="login-form" id="loginForm" novalidate inert>
          <div class="field">
            <input type="email" name="email" placeholder="Email" aria-label="Email" autocomplete="email" required>
            <button class="verify" type="button" aria-label="Send OTP to this email">Verify</button>
          </div>
          <input type="text" name="otp" placeholder="Enter OTP" aria-label="Enter OTP" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]*" required>
          <button class="btn" type="submit">Login</button>
          <div class="or">or</div>
          <button class="google" type="button" data-google>
            <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
            Continue with Google
          </button>
          <p class="msg" id="msgLogin" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="../js/vendor/supabase/supabase.js"></script>
  <script src="../supabase-config.js"></script>
  <script src="script.js"></script>
</body>
</html>
